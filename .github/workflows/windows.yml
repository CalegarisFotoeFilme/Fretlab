name: App para Windows

# Gera o instalador do FretLab para Windows (.exe, NSIS) numa máquina Windows do GitHub e publica um
# Release com o instalador assinado e o latest.json: o app instalado se atualiza sozinho a partir dele.
# Roda ao publicar uma tag de versão (v1.3.0…) ou à mão em Actions → "App para Windows" → Run workflow.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # assina o instalador (o app recusa atualizações sem esta assinatura)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: FretLab __VERSION__
          releaseBody: 'Instalador do FretLab para Windows. Quem já tem o app instalado recebe esta versão sozinho ao abrir.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: npx tauri
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: FretLab-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
