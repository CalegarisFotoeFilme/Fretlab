server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # rotas do app (SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # service worker e manifest nunca em cache, para atualizar o PWA
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # assets com hash e vendor (alphaTab, soundfont) podem ficar em cache
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /vendor/ { add_header Cache-Control "public, max-age=604800"; }

  types { application/octet-stream sf2; }
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
}
